name: Deploy Sphinx Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-docs-workflow
    tags:
      - "v*.*.*"

jobs:
  publish_sphinx_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tox
        run: python -m pip install tox

      - name: Build release docs
        run: tox -e docs-releases

      - name: Inspect multiversion build
        run: |
          echo "=== Git refs ==="
          git branch -a
          echo
          echo "=== HEAD ==="
          git log -1 --oneline
          echo
          echo "=== Built versions ==="
          find docs/_build/html -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort
          echo
          echo "=== Main index ==="
          ls -lah docs/_build/html/main/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          cname: docs.derivkit.org
          force_orphan: true
